name: ecg_artifact
description: "ECG artifact detection based on ECG quality and IBI"

steps:

  - input_data_types: ["ECG_filtered", "ECG_peaks", "ECG_ibi", "ECG_hr", "ECG_artifactual_peaks"]
    output_data_types: ["ECG_filtered", "ECG_peaks", "ECG_ibi", "ECG_hr", "ECG_artifactual_peaks"]
    transforms:
      - transform: TrimToMultiple
        config:
          duration: 30.0

  - input_data_types: ["ECG_filtered", "ECG_peaks"]
    output_data_types: ["ECG_quality"]
    transforms:
      - transform: ECGQuality
        config:
          quality_method: templatematch

  - input_data_types: ["ECG_ibi", "ECG_quality"]
    output_data_types: ["ECG_artifact"]
    transforms:
      - transform: IBIArtifactLabels
        config:
          segment_duration: 30
          quality_threshold: 0.7
          ibi_range: [300, 2000]  # Valid IBI range in ms
