name: ecg_processing
description: "ECG processing pipeline to extract peaks, inter-beat intervals, instantaneous heart rate, and signal quality"

steps:
  - input_data_types: ["ECG"]
    output_data_types: ["ECG_resampled"]
    transforms:
      - transform: Resample
        config:
          new_sample_rate: 128.0
  
  - input_data_types: ["ECG_resampled"]
    output_data_types: ["ECG_filtered", "ECG_peaks", "ECG_ibi", "ECG_rate"]
    transforms:
      - transform: ECGProcess
        config:
          peak_detection_method: neurokit
          correct_artifacts: true
          invert_signal: true

